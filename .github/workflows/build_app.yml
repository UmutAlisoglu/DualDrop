name: Build & release APK

on:
  workflow_dispatch:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # DualDrop releases are signed locally and attached by hand (see MAINTAINING.md). Without the
    # APP_KEYSTORE secret the tag build still runs, emits an unsigned release APK as an artifact and
    # skips the draft release, instead of failing in packageRelease on an empty keystore.
    env:
      HAS_KEYSTORE: ${{ secrets.APP_KEYSTORE != '' }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      # JDK 21 to match F-Droid's buildserver. Reproducible builds compare their APK against the
      # one this workflow attaches to the release, so the two toolchains have to agree — see
      # AllowedAPKSigningKeys in metadata/dev.konraditurbe.osmosis.yml over in fdroiddata.
      # Don't bump this without checking what F-Droid runs.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: printf "%s" "${{ secrets.APP_KEYSTORE }}" | base64 --decode > app-keystore.jks

      - name: Create keystore.properties
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cat > keystore.properties <<EOF
          storePassword=${{ secrets.STOREPASSWORD }}
          keyPassword=${{ secrets.KEYPASSWORD }}
          keyAlias=${{ secrets.KEYALIAS }}
          storeFile=../app-keystore.jks
          EOF

      - name: Build release + debug APKs
        run: bash ./gradlew assembleRelease assembleDebug

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Release APK only. The debug build stays an Actions artifact (above) where it is useful
      # for triage, and never becomes a release asset: it is signed with the debug key, so a tester
      # who grabs it instead of the real one gets "App not installed" over their existing install.
      # That happened on v1.3.1-rc1 and had to be cleaned up by hand.
      - name: Create draft GitHub Release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DualDrop ${{ github.ref_name }}
          draft: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
