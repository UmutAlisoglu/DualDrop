plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing — reads keystore.properties (created by CI from repo secrets). When it is absent
// — a plain source checkout, or a downstream packager such as F-Droid that signs with its own key —
// no signingConfig is attached at all and assembleRelease emits app-release-unsigned.apk. Attaching
// an empty signingConfig instead fails packageRelease with "missing required property storeFile".
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'dev.konraditurbe.osmosis'
    compileSdk 36

    defaultConfig {
        applicationId "de.druomi.dualdrop"
        minSdk 29
        targetSdk 36
        // Must exceed every code already in a tester's hands: 20 went out as
        // 1.3.3-action1-playback, 22 as 1.3.1-rc1, 23 was tagged v1.3.1 but never published, 24 is
        // the published v1.3.2, 25 the published v1.4.0, 26 the published v1.4.1, 27 the published
        // v1.4.2 and 28 the published v1.4.3.
        versionCode 3
        versionName "0.2.1"  // DualDrop 0.2.1, based on Osmosis 1.5.0
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])   // resolves relative to app/ → repo root
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    packaging {
        resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF'] }
    }

    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // AGP otherwise stuffs a Google-signed blob of the dependency list into the APK signing block.
    // It is opaque, it is not reproducible, and nothing here needs it. Requested by F-Droid review.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    // Pinned rather than taken transitively from appcompat: enableEdgeToEdge() (used by both
    // activities) landed in 1.8.0 and the edge-to-edge backport was refined for SDK 35 after it.
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    // DualDrop: "keep home Wi-Fi" via the phone's own Wireless debugging (no PC / root / Shizuku).
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    testImplementation 'junit:junit:4.13.2'
}
