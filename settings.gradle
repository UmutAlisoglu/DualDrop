pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // DualDrop: libadb-android (Wireless-debugging client) is published on JitPack only.
        maven { url 'https://jitpack.io'; content { includeGroupByRegex 'com.github.MuntashirAkon.*' } }
    }
}

rootProject.name = "DualDrop"
include ':app'
